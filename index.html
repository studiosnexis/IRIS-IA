<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Íris-IA</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="frame">

  <!-- topo: identidade + status -->
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <span class="brand-name">ÍRIS-IA</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnVoz" title="Ligar/desligar resposta falada">🔊</button>
      <button class="icon-btn" id="btnInfo" title="Sobre o grupo / anotações">⋮</button>
    </div>
  </header>

  <!-- linha decorativa de "teia" -->
  <svg class="web-line" viewBox="0 0 400 6" preserveAspectRatio="none">
    <line x1="0" y1="3" x2="400" y2="3" />
  </svg>

  <!-- painel lateral: grupo + anotações -->
  <aside class="panel" id="panel">
    <div class="panel-head">
      <h2>Registro</h2>
      <button class="icon-btn" id="btnClosePanel">✕</button>
    </div>

    <section class="panel-section">
      <h3>Quem me criou</h3>
      <p id="grupoTexto" class="muted"></p>
    </section>

    <section class="panel-section">
      <h3>Anotações salvas</h3>
      <div id="listaAnotacoes" class="notas-lista"></div>
      <form id="formNota" class="nota-form">
        <textarea id="novaNota" placeholder="Escrever uma nova anotação para a memória..." rows="2"></textarea>
        <button type="submit">Salvar anotação</button>
      </form>
    </section>
  </aside>

  <!-- conversa -->
  <main class="chat" id="chat"></main>

  <!-- entrada -->
  <form class="composer" id="composer">
    <button type="button" class="mic-btn" id="btnMic" title="Falar por voz (uma vez)">🎤</button>
    <button type="button" class="mic-btn" id="btnEscuta" title="Modo sempre ouvindo (diga o nome dela)">👂</button>
    <input type="text" id="entrada" placeholder="Fale com a Íris-IA..." autocomplete="off" />
    <button type="submit" id="btnEnviar">Enviar</button>
  </form>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="config.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
